worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;

    # Serve the frontend
    root /html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
      # Page specific <head> tags in index.html, see the include there
      ssi on;
    }

    # Sitemap is generated by the backend
    location = /sitemap.xml {
      proxy_pass http://backend:8000/api/sitemap.xml;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      # cover uploads, the backend takes up to 10 MB (nginx's default is 1 MB)
      client_max_body_size 11m;
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
