# Throwaway environment for e2e tests: fresh postgres + backend.
# Discord, SGDB and IGDB are disabled by not giving them any credentials.
# Use `make e2e` from backend/ rather than running this directly.
name: timeplayed-e2e

services:
  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: oblivionis
      TIMEPLAYED_DB: storage_v2
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ../evolutions:/evolutions:ro
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${E2E_DB_PORT:-55432}:5432"
    healthcheck:
      # init scripts run against a temporary socket-only server, so going over tcp
      # means init is done
      test: ["CMD", "psql", "-h", "127.0.0.1", "-U", "e2e", "-d", "storage_v2", "-c", "SELECT 1"]
      interval: 1s
      timeout: 3s
      retries: 30

  backend:
    build: ..
    environment:
      DB_HOST: postgres
      DB_USER: e2e
      DB_PASSWORD: e2e
      OBLIVIONIS_DB: oblivionis
      TIMEPLAYED_DB: storage_v2
      CACHE_ENABLED: "false"
      TIMEPLAYED_URL: http://localhost
    ports:
      - "${E2E_API_PORT:-58000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/ping"]
      interval: 1s
      timeout: 3s
      retries: 30
